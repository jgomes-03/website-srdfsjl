name: Deploy DEV

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  BACKEND_IMAGE: srdfsjl-backend
  FRONTEND_IMAGE: srdfsjl-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: write
      id-token: write   # required for OIDC login to Azure

    steps:
      - uses: actions/checkout@v4

      # ── Login to GHCR ────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          OWNER=$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "sha=$SHA_TAG" >> $GITHUB_OUTPUT
          echo "backend=${REGISTRY}/${OWNER}/${BACKEND_IMAGE}:dev-${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "backend_latest=${REGISTRY}/${OWNER}/${BACKEND_IMAGE}:dev" >> $GITHUB_OUTPUT
          echo "frontend=${REGISTRY}/${OWNER}/${FRONTEND_IMAGE}:dev-${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "frontend_latest=${REGISTRY}/${OWNER}/${FRONTEND_IMAGE}:dev" >> $GITHUB_OUTPUT

      # ── Build & push backend ────────────────────────────────────────
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.tags.outputs.backend }}
            ${{ steps.tags.outputs.backend_latest }}
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev

      # ── Build & push frontend ───────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.tags.outputs.frontend }}
            ${{ steps.tags.outputs.frontend_latest }}
          build-args: |
            REACT_APP_BACKEND_URL=${{ vars.REACT_APP_BACKEND_URL }}
            REACT_APP_AZURE_TENANT_ID=${{ vars.REACT_APP_AZURE_TENANT_ID }}
            REACT_APP_AZURE_CLIENT_ID=${{ vars.REACT_APP_AZURE_CLIENT_ID }}
          cache-from: type=gha,scope=frontend-dev
          cache-to: type=gha,mode=max,scope=frontend-dev

      # ── Azure login via OIDC ────────────────────────────────────────
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Deploy to Azure Container Apps ──────────────────────────────
      - name: Deploy backend to ACA
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ vars.ACA_BACKEND_NAME }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --image ${{ steps.tags.outputs.backend }}

      - name: Deploy frontend to ACA
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ vars.ACA_FRONTEND_NAME }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --image ${{ steps.tags.outputs.frontend }}
